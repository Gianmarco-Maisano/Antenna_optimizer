[Paths]
input_dir = optimizer/data
output_dir = optimizer/data
main_input_file = input.nec
main_output_file = output.out

[Simulation]
frequency = 144.0
min_freq = 143.0
max_freq = 145.0
num_freq_steps = 3
k_start = -1
k_stop = 1
k_step = 0.05
antenna_height_m = 4
ground_relative_permittivity = 13.0
ground_conductivity_s_per_m = 0.005
pattern_elevation_deg = 5

[GeneticAlgorithm]
num_elements = 3
min_length = 0.85
max_length = 1.05
total_distance = 3
lock_lengths = False
lock_distances = False
minimum_element_clearance_m = 0.03
wire_radius_m = 0.006
population_size = 100
num_generations = 250
crossover_probability = 0.2
mutation_probability = 0.1
target_real_impedance = 50
maximum_vswr = 1.5
coax_enabled = False
coax_length_m = 10.0
coax_impedance_ohm = 50.0
coax_velocity_factor = 0.66
coax_loss_db_per_100m = 15.0
balun_impedance_ratio = 1.0
impedance_tolerance = 5

[Output]
csv_output_file = optimized_individuals.csv
history_output_file = optimization_history.csv
enable_plots = True

